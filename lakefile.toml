name = "hex-lll-mathlib"
defaultTargets = ["HexLLLMathlib"]

# The full transitive Hex closure is pinned explicitly. Lake does not reconcile
# mismatched revisions of a package required at more than one point in the
# graph, so every Hex pin here must move together with its source repo.
leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "2d7f55d190cc2df9c9bf55437f344e65fbddc7c0"

[[require]]
name = "HexLLL"
git = "https://github.com/leanprover/hex-lll.git"
rev = "0903bf19d250627cd5526fec0dc990467d3776ba"

[[require]]
name = "HexGramSchmidtMathlib"
git = "https://github.com/leanprover/hex-gram-schmidt-mathlib.git"
rev = "b2b0e9bfdecb6d400aeaa0b508b6e232b93bfa47"

[[require]]
name = "HexRowReduceMathlib"
git = "https://github.com/leanprover/hex-row-reduce-mathlib.git"
rev = "c442625957482222e87d10b0d1d11dafd859ac91"

[[require]]
name = "HexDeterminantMathlib"
git = "https://github.com/leanprover/hex-determinant-mathlib.git"
rev = "4a552910b6cbaa3010378d965365871d5818514f"

[[require]]
name = "HexBareissMathlib"
git = "https://github.com/leanprover/hex-bareiss-mathlib.git"
rev = "79ed00ad497ec92f70a6a9439d499a06e6081793"

[[require]]
name = "HexMatrixMathlib"
git = "https://github.com/leanprover/hex-matrix-mathlib.git"
rev = "7da10508fdb5a489805004e5550992662b8b533c"

[[require]]
name = "HexGramSchmidt"
git = "https://github.com/leanprover/hex-gram-schmidt.git"
rev = "a6f9a5a3cefa8383a3736b35c94be35e1d830cf5"

[[require]]
name = "HexRowReduce"
git = "https://github.com/leanprover/hex-row-reduce.git"
rev = "1edfb6581a6f076170516da619cbe972fc9bc51a"

[[require]]
name = "HexDeterminant"
git = "https://github.com/leanprover/hex-determinant.git"
rev = "b9b21e295175885e2ee20728c8f8a13d00e36124"

[[require]]
name = "HexBareiss"
git = "https://github.com/leanprover/hex-bareiss.git"
rev = "00341772642a2f85b3541bd9ff063d2fcb169bb4"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "049bf8e57b33cb87b4012ed9d2da4cce0af296d9"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexLLLMathlib"
